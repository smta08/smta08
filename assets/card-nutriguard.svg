<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 180" width="460" height="180" role="img" aria-labelledby="t"><title id="t">NutriGuard: Android health tracker prototype. Meals via the Open Food Facts API with a halal filter, plus hydration, sleep and mood.</title>
<style>
  svg{--ink:#1f2328;--muted:#59636e;--line:#d1d9e0;--accent:#0f766e;--soft:#e3f2ef;--surface:#f6f8fa}
  @media (prefers-color-scheme:dark){svg{--ink:#e6edf3;--muted:#9198a1;--line:#3d444d;--accent:#2dd4bf;--soft:#0f2a27;--surface:#151b23}}
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}
  .ink{fill:var(--ink)} .muted{fill:var(--muted)} .accent{fill:var(--accent)}
  .box{fill:var(--surface);stroke:var(--line);stroke-width:1}
  .hot{fill:var(--soft);stroke:var(--accent);stroke-width:1.5}
  .dash{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 4}
  .wire{stroke:var(--muted);stroke-width:1.2;fill:none}
  .arrowhead{fill:var(--muted)}
  .blink{animation:b 1.1s steps(1) infinite} @keyframes b{50%{opacity:0}}
  .pulse{animation:p 2.4s ease-in-out infinite} @keyframes p{50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.blink,.pulse{animation:none}}
</style>

<rect x="1" y="1" width="458" height="178" rx="12" class="box"/>
<text x="24" y="44" class="sans ink" font-size="22" font-weight="700">NutriGuard</text>
<text x="436" y="42" text-anchor="end" class="mono accent" font-size="12">android · prototype</text>
<text x="24" y="78" class="sans ink" font-size="15">Daily health tracker: meals via Open Food</text>
<text x="24" y="100" class="sans ink" font-size="15">Facts with a halal filter, water, sleep, mood.</text>
<text x="24" y="136" class="mono muted" font-size="12.5">Java · Volley · Open Food Facts API</text>
<text x="24" y="160" class="mono muted" font-size="12.5">early prototype · README coming</text>

</svg>
